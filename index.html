<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior Pandelaki</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    overflow: hidden;
    background: black;
}

/* BINTANG */
.stars {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('https://www.transparenttextures.com/patterns/stardust.png');
    animation: moveStars 60s linear infinite;
    z-index: -1;
}

@keyframes moveStars {
    from {background-position: 0 0;}
    to {background-position: 1000px 1000px;}
}

/* CARD */
.card {
    position: relative;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    color: white;
    width: 300px;
    box-shadow: 0 0 25px rgba(0,0,0,0.5);
}

/* FOTO */
.profile {
    width: 120px;
    border-radius: 50%;
    border: 3px solid white;
}

/* BUTTON */
.btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 10px 0;
    padding: 10px;
    border-radius: 25px;
    text-decoration: none;
    color: white;
    font-weight: bold;
}

.ig { background: linear-gradient(45deg,#E1306C,#fd1d1d); }
.wa { background: #25D366; }

.btn img { width: 20px; }

.btn:hover {
    transform: scale(1.1);
}

/* TOMBOL MUSIK */
.music-btn {
    margin-top: 15px;
    padding: 8px 15px;
    border-radius: 20px;
    border: none;
    background: white;
    color: black;
    font-weight: bold;
}
</style>

</head>
<body>

<!-- MUSIK -->
<audio id="musik" autoplay loop>
    <source src="musik.mp3" type="audio/mpeg">
</audio>

<div class="stars"></div>

<div class="card">
    <img src="foto.jpg" class="profile">
    <h1>Junior Pandelaki</h1>
    <p>sukaa cewee cwee </p>
    <p>Welcome gadis gadis 😎</p>

    <a href="https://instagram.com/junior_pandelaki" class="btn ig" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png">
        Instagram
    </a>

    <a href="https://wa.me/6287781032832" class="btn wa" target="_blank">
        <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
        WhatsApp
    </a>

    <!-- Tombol Musik -->
    <button class="music-btn" onclick="playMusic()">Play / Pause Musik</button>
</div>

<script>
let music = document.getElementById("musik");

function playMusic() {
    if (music.paused) {
        music.play();
    } else {
        music.pause();
    }
}
</script>

</body>
  </html>
